        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message} (${err.name})`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenBtn.src = exitFullscreenImg;
                fullscreenBtn.alt = 'Exit Fullscreen';
                fullscreenBtn.title = 'Exit Fullscreen';
            } else {
                fullscreenBtn.src = enterFullscreenImg;
                fullscreenBtn.alt = 'Enter Fullscreen';
                fullscreenBtn.title = 'Fullscreen';
            }
        });

       
        fetch(rawUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.text();
            })
            .then(htmlContent => {
           
                setTimeout(() => {
                    loadingScreen.style.opacity = '0'; 
                    
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                        iframe.srcdoc = htmlContent;
                    }, 500); 

                }, 400); 
            })
            .catch(error => {
                console.error('Error fetching the HTML:', error);
                loadingScreen.innerHTML = '<p style="color: red; text-align: center; font-family: sans-serif;">Failed to load the content from GitHub.</p>';
            });
    </script>
