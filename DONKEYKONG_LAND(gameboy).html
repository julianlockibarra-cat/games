<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donkey Kong Land</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    // 1. Point EmulatorJS to the container div
    window.EJS_player = "#game";

    // 2. Set core to Game Boy
    window.EJS_core = "gb";

    // 3. Game display title
    window.EJS_gameName = "Donkey Kong Land";

    // 4. Direct link to the Donkey Kong Land .gb file
    window.EJS_gameUrl = "https://cdn.jsdelivr.net/gh/julianlockibarra-cat/assets@main/Donkey%20Kong%20Land%20(USA%2C%20Europe)%20(SGB%20Enhanced).gb";

    // 5. Custom CDN path for core assets
    window.EJS_pathtodata = "https://cdn.jsdelivr.net/gh/bubblfan/emu@7bf5cbb0b94866568d2aaa1fd42ebb5acd517e0d/";

    // 6. Auto-start game on load
    window.EJS_startOnLoaded = true;
  </script>

  <script src="https://cdn.jsdelivr.net/gh/bubblfan/emu@7bf5cbb0b94866568d2aaa1fd42ebb5acd517e0d/loader.js"></script>
</body>
</html>
