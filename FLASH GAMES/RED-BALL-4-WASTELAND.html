<!DOCTYPE HTML>
<html>
    <head>
        <meta charset='UTF8'>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden; 
                background-color: #000; 
            
            
            #ruffle {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id='ruffle'></div>
        <script src='https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle'></script>
        <script>
            var swfobject = {};

            swfobject.embedSWF = function(url, cont, width, height){
                var ruffle = window.RufflePlayer.newest(),
                    player = Object.assign(document.getElementById(cont).appendChild(ruffle.createPlayer()), {
                       
                        style: 'width: ' + width + '; height: ' + height + ';'
                    });
                
                player.load({ url: url });
            }

            swfobject.embedSWF('https://cdn.jsdelivr.net/gh/julianlockibarra-cat/assets@main/RED-BALL-4-WASTELAND.swf', 'ruffle', '100%', '100%');
        </script>
    </body>
</html>
